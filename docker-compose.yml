services:
  event-postgres:
    image: postgres:16
    container_name: event-postgres
    environment:
      POSTGRES_DB: event_service_db
      POSTGRES_USER: event
      POSTGRES_PASSWORD: event
    ports:
      - "5433:5432"
    volumes:
      - event-postgres-data:/var/lib/postgresql/data

  booking-postgres:
    image: postgres:16
    container_name: booking-postgres
    environment:
      POSTGRES_DB: booking_service_db
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5434:5432"
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data

  identity-postgres:
    image: postgres:16
    container_name: identity-postgres
    environment:
      POSTGRES_DB: identity_service_db
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity
    ports:
      - "5435:5432"
    volumes:
      - identity-postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  event-postgres-data:
  booking-postgres-data:
  identity-postgres-data: